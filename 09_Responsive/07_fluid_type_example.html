<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 07 - Fluid Typography</title>
		<link rel="stylesheet" href="07_fluid_type_example.css">
	</head>
	<body>

		<!-- Drag the window narrower and wider. Then zoom in with Ctrl and +: which ones grow? -->
		<p class="label">font-size: 5vw</p>
		<p class="vw-only">Fresh from the wharf</p>

		<p class="label">6vw up to 768px, then 3vw</p>
		<p class="vw-jump">Fresh from the wharf</p>

		<p class="label">clamp(1.5rem, 1rem + 3vw, 3rem)</p>
		<p class="fluid">Fresh from the wharf</p>

	</body>
</html>
