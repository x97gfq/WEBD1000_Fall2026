<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 02 - The Viewport Meta Tag</title>
		<link rel="stylesheet" href="02_viewport_example.css">
	</head>
	<body>

		<!-- The demo: turn on the device toolbar (F12, then Ctrl + Shift + M) and pick a phone.
			Now comment out the viewport meta tag above, save, and reload. -->
		<h1>The Viewport Meta Tag</h1>

		<img src="images/harbour.jpg" width="800" height="458"
			alt="Rocky beach with calm water and a tree-lined point">

		<p>With the viewport tag, a phone uses its real width and this text is
			easy to read. Without it, the phone pretends to be about 980 pixels
			wide and shrinks the whole page to fit, so you have to pinch and zoom.</p>

	</body>
</html>
