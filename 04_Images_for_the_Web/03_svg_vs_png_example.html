<!DOCTYPE html> 
<html lang="en"> 
	<head> 
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 03 - SVG vs PNG vs JPG</title> 
		<!-- CSS is next class! This just colours the background
			so you can see which images are transparent -->
		<style>
			body { background-color: #E1E8EB; }
		</style>
	</head> 
	<body> 

		<h1>Logos: Vector vs Raster</h1>

		<h2>Small (100 pixels wide)</h2>
		<!-- All three look about the same when they're small -->
		<img src="samples/logo.svg" width="100" height="100"
			alt="Harbourside Fish and Chips">
		<img src="samples/logo.png" width="100" height="100"
			alt="Harbourside Fish and Chips">
		<img src="samples/logo.jpg" width="100" height="100"
			alt="Harbourside Fish and Chips">

		<h2>Big (900 pixels wide)</h2>

		<!-- SVG: shapes described in code. Sharp at ANY size. 0.7 KB -->
		<h3>SVG (0.7 KB)</h3>
		<img src="samples/logo.svg" width="900" height="900"
			alt="Harbourside Fish and Chips">

		<!-- PNG: 600 x 600 pixels, stretched to 900. Soft edges. 21 KB -->
		<h3>PNG (21 KB)</h3>
		<img src="samples/logo.png" width="900" height="900"
			alt="Harbourside Fish and Chips">

		<!-- JPG: no transparency (white corners) and smudgy edges. 21 KB -->
		<h3>JPG (21 KB)</h3>
		<img src="samples/logo.jpg" width="900" height="900"
			alt="Harbourside Fish and Chips">

	</body> 
</html>
