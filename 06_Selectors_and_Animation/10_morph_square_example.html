<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 10 - A Shape-shifting Square</title>
		<style>
			.square {
				width: 100px;
				height: 100px;
				margin: 80px auto;
				background-color: #A02B93;
				animation: morph 3s ease-in-out infinite;
			}

			/* No 0%: it starts from the square's normal style */
			@keyframes morph {
				50% {
					transform: rotate(180deg) scale(1.5);
					border-radius: 50%;          /* a circle! */
					background-color: #0F9ED5;
				}
				100% {
					transform: rotate(360deg);   /* one full turn */
				}
			}
		</style>
	</head>
	<body>

		<div class="square"></div>

	</body>
</html>
