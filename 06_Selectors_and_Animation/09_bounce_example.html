<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 09 - A Bouncing Ball</title>
		<style>
			.floor {
				height: 400px;
				border-bottom: 6px solid #262626;
			}

			.ball {
				width: 100px;
				height: 100px;
				margin: 0 auto;
				border-radius: 50%;
				background-color: #E97132;
				transform-origin: center bottom;   /* squash against the floor */
				animation: bounce 1.2s infinite;
			}

			@keyframes bounce {
				0% {
					transform: translateY(0);
					animation-timing-function: ease-in;    /* falls faster and faster */
				}
				45% {
					transform: translateY(300px);          /* touches the floor */
				}
				50% {
					transform: translateY(300px) scale(1.3, 0.7);   /* squash! */
				}
				55% {
					transform: translateY(300px);
					animation-timing-function: ease-out;   /* slows down going up */
				}
				100% {
					transform: translateY(0);
				}
			}
		</style>
	</head>
	<body>

		<div class="floor">
			<div class="ball"></div>
		</div>

	</body>
</html>
