<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 12 - Animation in Real Websites</title>
		<style>
			body {
				font-family: "Segoe UI", Arial, sans-serif;
			}

			/* 1. Fade in and slide up when the page loads (runs once) */
			h1 {
				animation: fade-up 1s ease-out;
			}

			@keyframes fade-up {
				from { opacity: 0; transform: translateY(30px); }
				to   { opacity: 1; transform: translateY(0); }
			}

			/* 2. A loading spinner: a circle with one coloured side */
			.spinner {
				width: 50px;
				height: 50px;
				border: 8px solid #E1E8EB;
				border-top-color: #1B5E82;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			@keyframes spin { to { transform: rotate(360deg); } }

			/* 3. A "look at me" pulse */
			.badge {
				display: inline-block;
				padding: 6px 14px;
				border-radius: 20px;
				background-color: #C62828;
				color: white;
				animation: pulse 1.5s ease-in-out infinite;
			}

			@keyframes pulse { 50% { transform: scale(1.15); } }

			/* 4. Respect people who turn animations off in their settings */
			@media (prefers-reduced-motion: reduce) {
				h1, .spinner, .badge {
					animation: none;
				}
			}
		</style>
	</head>
	<body>

		<h1>Welcome to Harbourside</h1>
		<div class="spinner" role="status" aria-label="Loading"></div>
		<p><span class="badge">Today only!</span> Lobster rolls are 2 for 1.</p>

	</body>
</html>
