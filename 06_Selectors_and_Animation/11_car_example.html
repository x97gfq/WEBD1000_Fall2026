<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 11 - A Car Made of Boxes</title>
		<style>
			.road {
				margin-top: 60px;
				overflow: hidden;   /* hide the car when it's off the road */
				border-bottom: 8px dashed #595959;
			}

			.car {
				position: relative;   /* the parts are placed inside the car */
				width: 160px;
				height: 95px;
				animation: drive 4s linear infinite;
			}

			.roof, .car-body, .wheel {
				position: absolute;
				background-color: #12304A;
			}

			.roof {
				left: 30px; bottom: 55px; width: 80px; height: 35px;
				border-radius: 30px 30px 0 0;
			}

			.car-body {
				left: 0; bottom: 20px; width: 160px; height: 40px;
				border-radius: 10px 30px 8px 8px;
			}

			.wheel {
				bottom: 0; width: 40px; height: 40px; border-radius: 50%;
				border: 7px dashed #BFBFBF;    /* dashes show the spin */
				animation: spin 0.5s linear infinite;
			}

			.back  { left: 15px; }
			.front { right: 15px; }

			@keyframes drive {
				from { transform: translateX(-200px); }   /* off the left edge */
				to   { transform: translateX(100vw); }    /* off the right edge */
			}

			@keyframes spin { to { transform: rotate(360deg); } }
		</style>
	</head>
	<body>

		<div class="road">
			<div class="car">
				<div class="roof"></div>
				<div class="car-body"></div>
				<div class="wheel back"></div>
				<div class="wheel front"></div>
			</div>
		</div>

	</body>
</html>
