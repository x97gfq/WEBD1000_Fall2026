<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Animation Playground</title>
		<!-- stage.css draws the stages and objects. Don't change it. -->
		<link rel="stylesheet" href="stage.css">
		<!-- style.css is yours: all your animations go here -->
		<link rel="stylesheet" href="style.css">
	</head>
	<body>

		<header>
			<h1>Animation Playground</h1>
			<p>Four stages. Make every one of them move!</p>
		</header>

		<main>
			<section>
				<h2>1. Roll</h2>
				<div class="stage">
					<div class="ball" id="roll"></div>
				</div>
			</section>

			<section>
				<h2>2. Ping-pong</h2>
				<div class="stage">
					<div class="ball" id="ping-pong"></div>
				</div>
			</section>

			<section>
				<h2>3. Pinwheel</h2>
				<div class="stage centred">
					<div class="pinwheel" id="pinwheel"></div>
				</div>
			</section>

			<section>
				<h2>4. Pulse</h2>
				<div class="stage centred">
					<div class="box" id="pulse"></div>
				</div>
			</section>

			<section>
				<h2>Bonus: Around the Block</h2>
				<div class="stage">
					<div class="ball" id="around"></div>
				</div>
			</section>
		</main>

		<footer>
			<p>Made by ____________ for WEBD 1000</p>
		</footer>

	</body>
</html>
