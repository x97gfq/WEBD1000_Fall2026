<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 13 - grid-template-areas</title>
		<link rel="stylesheet" href="13_grid_areas_example.css">
	</head>
	<body>

		<!-- The same HTML as Example 12. Only the CSS changed -->
		<div class="grid-container">
			<header class="grid-item">Header</header>
			<nav class="grid-item">
				<a href="#">Home</a>
				<a href="#">Menu</a>
				<a href="#">Contact</a>
			</nav>
			<main class="grid-item">
				<h1>Main Content</h1>
				<p>Three columns, and every part goes in the area with its name.</p>
			</main>
			<aside class="grid-item">Sidebar</aside>
			<footer class="grid-item">Footer</footer>
		</div>

	</body>
</html>
