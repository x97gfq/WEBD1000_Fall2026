<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 02 - flex-direction</title>
		<link rel="stylesheet" href="02_flex_direction_example.css">
	</head>
	<body>

		<h1>Example 02: flex-direction sets the main axis</h1>

		<div class="demos">
			<section>
				<h2><code>row</code> (the default) &rarr;</h2>
				<div class="container row">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>

			<section>
				<h2><code>row-reverse</code> &larr;</h2>
				<div class="container row-reverse">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>

			<section>
				<h2><code>column</code> &darr;</h2>
				<div class="container column">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>

			<section>
				<h2><code>column-reverse</code> &uarr;</h2>
				<div class="container column-reverse">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>
		</div>

	</body>
</html>
