<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 06 - flex-wrap and gap</title>
		<link rel="stylesheet" href="06_flex_wrap_example.css">
	</head>
	<body>

		<h1>Example 06: flex-wrap and gap</h1>

		<h2><code>flex-wrap: nowrap</code> (the default): one line, so they squash</h2>
		<div class="container nowrap">
			<div class="card">Card 1</div>
			<div class="card">Card 2</div>
			<div class="card">Card 3</div>
			<div class="card">Card 4</div>
			<div class="card">Card 5</div>
			<div class="card">Card 6</div>
			<div class="card">Card 7</div>
		</div>

		<h2><code>flex-wrap: wrap</code>: they keep their width and start a new line</h2>
		<div class="container wrap">
			<div class="card">Card 1</div>
			<div class="card">Card 2</div>
			<div class="card">Card 3</div>
			<div class="card">Card 4</div>
			<div class="card">Card 5</div>
			<div class="card">Card 6</div>
			<div class="card">Card 7</div>
		</div>

	</body>
</html>
