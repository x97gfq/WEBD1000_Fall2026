<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Grid Playground</title>
		<link rel="stylesheet" href="playground.css">
	</head>
	<body>

		<header>
			<h1>Grid Playground</h1>
			<p>Pick a value, or type your own in the columns box. The code box shows the CSS you would write.</p>
		</header>

		<main class="playground">
			<form class="controls">
				<fieldset data-selector=".container">
					<legend>The container (the parent)</legend>
					<label>display
						<select data-prop="display">
							<option>grid</option>
							<option>block</option>
						</select>
					</label>
					<label>grid-template-columns
						<input data-prop="grid-template-columns" value="1fr 1fr 1fr" list="column-ideas">
						<datalist id="column-ideas">
							<option value="1fr 1fr 1fr"></option>
							<option value="repeat(4, 1fr)"></option>
							<option value="1fr 2fr 1fr"></option>
							<option value="200px 1fr"></option>
							<option value="100px 100px"></option>
							<option value="repeat(auto-fit, minmax(150px, 1fr))"></option>
						</datalist>
					</label>
					<label>grid-auto-rows
						<select data-prop="grid-auto-rows" data-default="auto">
							<option>auto</option>
							<option>80px</option>
							<option>120px</option>
						</select>
					</label>
					<label>gap
						<select data-prop="gap" data-default="0">
							<option>0</option>
							<option>8px</option>
							<option>16px</option>
							<option>32px</option>
						</select>
					</label>
					<label>justify-items
						<select data-prop="justify-items" data-default="stretch">
							<option>stretch</option>
							<option>start</option>
							<option>center</option>
							<option>end</option>
						</select>
					</label>
					<label>align-items
						<select data-prop="align-items" data-default="stretch">
							<option>stretch</option>
							<option>start</option>
							<option>center</option>
							<option>end</option>
						</select>
					</label>
				</fieldset>

				<fieldset data-selector=".item:nth-child(2)">
					<legend>Item 2 (the orange one)</legend>
					<label>grid-column
						<select data-prop="grid-column" data-default="auto">
							<option>auto</option>
							<option>span 2</option>
							<option>span 3</option>
							<option>1 / 3</option>
							<option>2 / 4</option>
							<option>1 / -1</option>
						</select>
					</label>
					<label>grid-row
						<select data-prop="grid-row" data-default="auto">
							<option>auto</option>
							<option>span 2</option>
							<option>span 3</option>
							<option>1 / 3</option>
						</select>
					</label>
				</fieldset>

				<p class="buttons">
					<button type="button" class="add">Add an item</button>
					<button type="button" class="remove">Remove one</button>
					<button type="reset">Reset</button>
				</p>
			</form>

			<div class="stage">
				<div class="container">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3<br>three</div>
					<div class="item">4</div>
					<div class="item">5</div>
					<div class="item">6</div>
				</div>
			</div>

			<pre class="code"><code></code></pre>
		</main>

		<script src="playground.js"></script>
	</body>
</html>
