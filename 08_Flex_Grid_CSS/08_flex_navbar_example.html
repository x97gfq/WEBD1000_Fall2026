<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 08 - A Flexbox Header</title>
		<link rel="stylesheet" href="08_flex_navbar_example.css">
	</head>
	<body>

		<header class="site-header">
			<a class="logo" href="#">Harbourside</a>
			<nav aria-label="Main">
				<ul>
					<li><a href="#menu">Menu</a></li>
					<li><a href="#hours">Hours</a></li>
					<li><a href="#contact">Contact</a></li>
				</ul>
			</nav>
			<a class="button" href="#order">Order online</a>
		</header>

		<main>
			<p>The header is a flex container with <strong>three</strong> items: the logo, the nav and the button.
				The nav's <code>ul</code> is a flex container too: flex inside flex.</p>
		</main>

	</body>
</html>
