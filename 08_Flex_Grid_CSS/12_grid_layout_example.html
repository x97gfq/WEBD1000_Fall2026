<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 12 - A Page Layout with Grid</title>
		<link rel="stylesheet" href="12_grid_layout_example.css">
	</head>
	<body>

		<!-- The "Practical Example" from the slides: where does the Sidebar end up? -->
		<div class="grid-container">
			<header class="grid-item">Header</header>
			<nav class="grid-item">
				<a href="#">Home</a>
				<a href="#">Menu</a>
				<a href="#">Contact</a>
			</nav>
			<main class="grid-item">
				<h1>Main Content</h1>
				<p>Two columns: 1fr for the nav, 3fr for the main content.</p>
			</main>
			<aside class="grid-item">Sidebar</aside>
			<footer class="grid-item">Footer</footer>
		</div>

	</body>
</html>
