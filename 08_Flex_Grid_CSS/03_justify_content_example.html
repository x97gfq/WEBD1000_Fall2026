<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 03 - justify-content</title>
		<link rel="stylesheet" href="03_justify_content_example.css">
	</head>
	<body>

		<h1>Example 03: justify-content (along the main axis)</h1>

		<h2><code>flex-start</code> (the default)</h2>
		<div class="container start">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>

		<h2><code>center</code></h2>
		<div class="container center">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>

		<h2><code>flex-end</code></h2>
		<div class="container end">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>

		<h2><code>space-between</code></h2>
		<div class="container between">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>

		<h2><code>space-around</code></h2>
		<div class="container around">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>

		<h2><code>space-evenly</code></h2>
		<div class="container evenly">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>

	</body>
</html>
