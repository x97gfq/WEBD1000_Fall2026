<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 04 - align-items</title>
		<link rel="stylesheet" href="04_align_items_example.css">
	</head>
	<body>

		<h1>Example 04: align-items (along the cross axis)</h1>

		<div class="demos">
			<section>
				<h2><code>stretch</code> (default)</h2>
				<div class="container stretch">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>

			<section>
				<h2><code>flex-start</code></h2>
				<div class="container start">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>

			<section>
				<h2><code>center</code></h2>
				<div class="container center">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>

			<section>
				<h2><code>flex-end</code></h2>
				<div class="container end">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>

			<section>
				<h2><code>baseline</code></h2>
				<div class="container baseline">
					<div class="item">1</div>
					<div class="item">2</div>
					<div class="item">3</div>
				</div>
			</section>
		</div>

	</body>
</html>
