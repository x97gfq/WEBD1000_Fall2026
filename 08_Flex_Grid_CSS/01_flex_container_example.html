<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 01 - display: flex</title>
		<link rel="stylesheet" href="01_flex_container_example.css">
	</head>
	<body>

		<h1>Example 01: display: flex</h1>

		<h2>Without flex: every div takes a whole line</h2>
		<div class="container">
			<div class="item">One</div>
			<div class="item">Two</div>
			<div class="item">Number three</div>
			<div class="item">4</div>
		</div>

		<h2>With <code>display: flex</code> on the container: side by side</h2>
		<div class="container flex">
			<div class="item">One</div>
			<div class="item">Two</div>
			<div class="item">Number three</div>
			<div class="item">4</div>
		</div>

	</body>
</html>
