<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 11 - Spanning Rows and Columns</title>
		<link rel="stylesheet" href="11_grid_span_example.css">
	</head>
	<body>

		<h1>Example 11: spanning rows and columns</h1>

		<div class="grid">
			<div class="item a">A: span 2 columns</div>
			<div class="item">B</div>
			<div class="item c">C: span 2 rows</div>
			<div class="item">D</div>
			<div class="item e">E: lines 2 / 4</div>
			<div class="item f">F: 1 / -1 (all the way across)</div>
			<div class="item">G</div>
			<div class="item">H</div>
		</div>

	</body>
