<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 02: Menu Cards in Bootstrap</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	</head>
	<body class="bg-body-tertiary">
		<!-- The same three cards as Example 03, built with Bootstrap's components -->
		<div class="container py-4">
			<h1 class="h3 mb-3">Our Menu</h1>
			<div class="row g-3">
				<div class="col-md-4">
					<article class="card h-100 shadow-sm">
						<div class="card-body">
							<h2 class="card-title h5">Haddock &amp; Chips</h2>
							<p class="card-text">Local haddock, with fries and coleslaw.</p>
							<p class="fw-bold text-danger">$16.99</p>
							<a href="#" class="btn btn-primary">Order</a>
						</div>
					</article>
				</div>
				<div class="col-md-4">
					<article class="card h-100 shadow-sm">
						<div class="card-body">
							<h2 class="card-title h5">Clam Strips</h2>
							<p class="card-text">Lightly breaded clam strips with fries and tartar sauce.</p>
							<p class="fw-bold text-danger">$14.50</p>
							<a href="#" class="btn btn-primary">Order</a>
						</div>
					</article>
				</div>
				<div class="col-md-4">
					<article class="card h-100 shadow-sm">
						<div class="card-body">
							<h2 class="card-title h5">Lobster Roll</h2>
							<p class="card-text">Fresh lobster on a toasted bun with a side salad.</p>
							<p class="fw-bold text-danger">$24.00</p>
							<a href="#" class="btn btn-primary">Order</a>
						</div>
					</article>
				</div>
			</div>
		</div>
	</body>
</html>
