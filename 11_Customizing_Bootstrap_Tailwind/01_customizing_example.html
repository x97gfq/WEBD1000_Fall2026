<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 01: Customizing Bootstrap</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
		<!-- Ours goes after Bootstrap's -->
		<link rel="stylesheet" href="01_customizing_example.css">
	</head>
	<body>
		<div class="container py-4">
			<h1 class="h3">Hover over each button</h1>
			<p>
				<button type="button" class="btn btn-primary old-way">1. The old way</button>
				<button type="button" class="btn btn-primary new-way">2. Bootstrap 5's way</button>
			</p>
			<p>Button 1 turns blue when you hover. Button 2 stays orange. Look in <code>01_customizing_example.css</code> to see why.</p>
		</div>
	</body>
</html>
