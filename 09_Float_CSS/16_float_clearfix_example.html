<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 16 - Floats and the Clearfix</title>
		<link rel="stylesheet" href="16_float_clearfix_example.css">
	</head>
	<body>

		<h1>Example 16: two floated columns</h1>

		<h2>1. The problem: the box collapses (its border is the line at the top)</h2>
		<div class="box">
			<div class="float-left">Left column</div>
			<div class="float-right">Right column</div>
		</div>

		<h2>2. The clearfix hack: the box wraps the columns</h2>
		<div class="box clearfix">
			<div class="float-left">Left column</div>
			<div class="float-right">Right column</div>
		</div>

		<h2>3. The modern fix: <code>display: flow-root</code></h2>
		<div class="box flow-root">
			<div class="float-left">Left column</div>
			<div class="float-right">Right column</div>
		</div>

	</body>
</html>
