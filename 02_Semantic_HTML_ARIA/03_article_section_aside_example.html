<!DOCTYPE html> 
<html lang="en"> 
	<head> 
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 03 - Article, Section, Aside</title> 
	</head> 
	<body> 

		<main>
			<!-- article: makes sense on its own -->
			<article>
				<h2>Campus Cinnamon Bun Day</h2>
				<p>Every Wednesday the cafeteria bakes cinnamon buns.</p>

				<!-- section: a themed part, with its own heading -->
				<section>
					<h3>When</h3>
					<p>Wednesdays, starting at 10am.</p>
				</section>

				<section>
					<h3>Where</h3>
					<p>The main cafeteria.</p>
				</section>
			</article>

			<!-- aside: related, but not essential -->
			<aside>
				<h2>Did you know?</h2>
				<p>Burridge hosts one of the Cube locations.</p>
			</aside>
		</main>

	</body> 
</html>
