<!DOCTYPE html> 
<html lang="en"> 
	<head> 
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 04 - Figure and Figcaption</title> 
	</head> 
	<body> 

		<h1>Life Near Campus</h1>

		<figure>
			<!-- alt: replaces the image for people who can't see it -->
			<img src="beach.JPG" width="500"
				alt="Sandy beach with waves under a clear blue sky">

			<!-- figcaption: a visible caption for everyone -->
			<figcaption>
				Mavillette Beach, a short drive from the Yarmouth campus.
			</figcaption>
		</figure>

	</body> 
</html>
