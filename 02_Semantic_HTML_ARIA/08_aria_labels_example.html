<!DOCTYPE html> 
<html lang="en"> 
	<head> 
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 08 - ARIA Labels</title> 
	</head> 
	<body> 

		<!-- Two navs on one page: aria-label tells them apart -->
		<nav aria-label="Main">
			<ul>
				<!-- aria-current: "this is the page you're on" -->
				<li><a href="index.html" aria-current="page">Home</a></li>
				<li><a href="programs.html">Programs</a></li>
			</ul>
		</nav>

		<!-- aria-labelledby: use the visible heading as the name -->
		<section aria-labelledby="news-heading">
			<h2 id="news-heading">Campus News</h2>
			<p>Orientation starts Tuesday, September 8.</p>
		</section>

		<!-- Icon-only button: without aria-label it's "times, button" -->
		<button type="button" aria-label="Close menu">&times;</button>

		<nav aria-label="Footer">
			<a href="privacy.html">Privacy</a>
		</nav>

	</body> 
</html>
