<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 06: A Navbar</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	</head>
	<body>
		<!-- navbar-expand-md: the full menu from 768px up -->
		<nav class="navbar navbar-expand-md bg-body-tertiary" aria-label="Main">
			<div class="container">
				<a class="navbar-brand" href="#">Harbourside</a>

				<!-- data-bs-target: the id of the part to open -->
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#mainNav"
					aria-controls="mainNav" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse" id="mainNav">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item">
							<a class="nav-link active" aria-current="page" href="#">Home</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">Menu</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">Contact</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>

		<main class="container py-4">
			<h1 class="h3">Make the window narrow</h1>
			<p>Under 768px the links fold away behind the menu button. Click it to open them.
				That part needs Bootstrap's JavaScript, linked at the bottom of this file.</p>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
