<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
	<!-- The warm-up's wireframe: one page, on a wide screen and on a phone.
	     The faint orange stripes are Bootstrap's 12 columns: count them. -->
	<rect width="1200" height="720" fill="#FFFFFF"/>

	<!-- ===== Wide screen ===== -->
	<rect x="20" y="20" width="800" height="650" rx="10" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
	<path d="M20 56 H820" stroke="#333" stroke-width="2"/>
	<circle cx="42" cy="38" r="6" fill="#BBB"/><circle cx="62" cy="38" r="6" fill="#BBB"/><circle cx="82" cy="38" r="6" fill="#BBB"/>
	<rect x="110" y="29" width="300" height="18" rx="9" fill="#EEE"/>

	<!-- the 12 columns -->
	<g fill="#E97132" fill-opacity="0.10">
		<rect x="44" y="92" width="55" height="560"/><rect x="107" y="92" width="55" height="560"/><rect x="171" y="92" width="55" height="560"/>
		<rect x="234" y="92" width="55" height="560"/><rect x="297" y="92" width="55" height="560"/><rect x="361" y="92" width="55" height="560"/>
		<rect x="424" y="92" width="55" height="560"/><rect x="487" y="92" width="55" height="560"/><rect x="551" y="92" width="55" height="560"/>
		<rect x="614" y="92" width="55" height="560"/><rect x="677" y="92" width="55" height="560"/><rect x="741" y="92" width="55" height="560"/>
	</g>
	<g font-size="13" font-weight="700" fill="#E97132" text-anchor="middle">
		<text x="71" y="82">1</text><text x="134" y="82">2</text><text x="198" y="82">3</text><text x="261" y="82">4</text>
		<text x="324" y="82">5</text><text x="388" y="82">6</text><text x="451" y="82">7</text><text x="514" y="82">8</text>
		<text x="578" y="82">9</text><text x="641" y="82">10</text><text x="704" y="82">11</text><text x="768" y="82">12</text>
	</g>

	<g fill="#F4F4F4" fill-opacity="0.85" stroke="#555" stroke-width="2">
		<!-- header -->
		<rect x="40" y="100" width="760" height="90"/>
		<!-- sidebar -->
		<rect x="40" y="200" width="185" height="360"/>
		<!-- main -->
		<rect x="235" y="200" width="565" height="360"/>
		<!-- footer -->
		<rect x="40" y="570" width="760" height="70"/>
	</g>

	<!-- header: a logo and the site name -->
	<rect x="60" y="120" width="50" height="50" fill="none" stroke="#999" stroke-width="1.5"/>
	<path d="M60 120 L110 170 M110 120 L60 170" stroke="#999" stroke-width="1.5"/>
	<rect x="125" y="133" width="220" height="24" fill="#999"/>
	<text x="785" y="125" font-size="15" font-weight="700" fill="#333" text-anchor="end">HEADER</text>

	<!-- sidebar: a heading and links -->
	<text x="55" y="226" font-size="15" font-weight="700" fill="#333">SIDEBAR</text>
	<rect x="55" y="245" width="110" height="16" fill="#999"/>
	<g fill="#BBB"><rect x="55" y="280" width="140" height="10"/><rect x="55" y="305" width="120" height="10"/><rect x="55" y="330" width="135" height="10"/><rect x="55" y="355" width="100" height="10"/></g>

	<!-- main: a heading, text and a picture -->
	<text x="250" y="226" font-size="15" font-weight="700" fill="#333">MAIN</text>
	<rect x="250" y="245" width="260" height="22" fill="#999"/>
	<g fill="#BBB">
		<rect x="250" y="285" width="530" height="10"/><rect x="250" y="305" width="510" height="10"/><rect x="250" y="325" width="525" height="10"/><rect x="250" y="345" width="320" height="10"/>
		<rect x="250" y="375" width="530" height="10"/><rect x="250" y="395" width="490" height="10"/><rect x="250" y="415" width="260" height="10"/>
	</g>
	<rect x="250" y="445" width="530" height="98" fill="none" stroke="#999" stroke-width="1.5"/>
	<path d="M250 445 L780 543 M780 445 L250 543" stroke="#999" stroke-width="1.5"/>

	<!-- footer -->
	<text x="55" y="597" font-size="15" font-weight="700" fill="#333">FOOTER</text>
	<rect x="55" y="610" width="170" height="10" fill="#BBB"/>

	<text x="420" y="700" font-size="17" font-weight="700" fill="#333" text-anchor="middle">WIDE SCREEN (768px and wider)</text>

	<!-- ===== Phone ===== -->
	<rect x="880" y="20" width="290" height="650" rx="30" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
	<rect x="985" y="34" width="80" height="10" rx="5" fill="#BBB"/>
	<g fill="#F4F4F4" stroke="#555" stroke-width="2">
		<rect x="900" y="60" width="250" height="70"/>
		<rect x="900" y="138" width="250" height="120"/>
		<rect x="900" y="266" width="250" height="310"/>
		<rect x="900" y="584" width="250" height="56"/>
	</g>
	<rect x="912" y="75" width="40" height="40" fill="none" stroke="#999" stroke-width="1.5"/>
	<path d="M912 75 L952 115 M952 75 L912 115" stroke="#999" stroke-width="1.5"/>
	<rect x="962" y="86" width="120" height="18" fill="#999"/>
	<text x="1140" y="78" font-size="11" font-weight="700" fill="#333" text-anchor="end">HEADER</text>
	<text x="912" y="160" font-size="13" font-weight="700" fill="#333">SIDEBAR</text>
	<g fill="#BBB"><rect x="912" y="178" width="140" height="9"/><rect x="912" y="198" width="120" height="9"/><rect x="912" y="218" width="135" height="9"/><rect x="912" y="238" width="100" height="9"/></g>
	<text x="912" y="288" font-size="13" font-weight="700" fill="#333">MAIN</text>
	<rect x="912" y="300" width="160" height="18" fill="#999"/>
	<g fill="#BBB">
		<rect x="912" y="332" width="226" height="9"/><rect x="912" y="350" width="210" height="9"/><rect x="912" y="368" width="220" height="9"/><rect x="912" y="386" width="140" height="9"/>
		<rect x="912" y="410" width="226" height="9"/><rect x="912" y="428" width="190" height="9"/>
	</g>
	<rect x="912" y="452" width="226" height="110" fill="none" stroke="#999" stroke-width="1.5"/>
	<path d="M912 452 L1138 562 M1138 452 L912 562" stroke="#999" stroke-width="1.5"/>
	<text x="912" y="606" font-size="13" font-weight="700" fill="#333">FOOTER</text>
	<rect x="912" y="618" width="120" height="9" fill="#BBB"/>

	<text x="1025" y="700" font-size="17" font-weight="700" fill="#333" text-anchor="middle">PHONE (under 768px)</text>
</svg>
