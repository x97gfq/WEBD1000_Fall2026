<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 02: The 12-Column Grid</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
		<!-- Only colours the columns, so you can see them. Bootstrap does the layout. -->
		<link rel="stylesheet" href="02_grid_example.css">
	</head>
	<body>
		<div class="container py-4">
			<h1 class="h3">Every row has 12 columns</h1>

			<!-- 12 columns of 1 -->
			<div class="row">
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
				<div class="col-1">1</div>
			</div>

			<!-- Halves: 6 + 6 = 12 -->
			<div class="row">
				<div class="col-6">col-6</div>
				<div class="col-6">col-6</div>
			</div>

			<!-- Thirds: 4 + 4 + 4 = 12 -->
			<div class="row">
				<div class="col-4">col-4</div>
				<div class="col-4">col-4</div>
				<div class="col-4">col-4</div>
			</div>

			<!-- A sidebar: 3 + 9 = 12 -->
			<div class="row">
				<div class="col-3">col-3</div>
				<div class="col-9">col-9</div>
			</div>

			<!-- Too many: 6 + 4 + 4 = 14, so the last one wraps -->
			<div class="row">
				<div class="col-6">col-6</div>
				<div class="col-4">col-4</div>
				<div class="col-4">col-4 (wraps)</div>
			</div>
		</div>
	</body>
</html>
