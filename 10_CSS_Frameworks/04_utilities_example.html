<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 04: Colour and Spacing Utilities</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	</head>
	<body>
		<!-- No CSS file of our own: every style on this page is a Bootstrap class -->
		<div class="container py-4">
			<div class="row g-4">
				<section class="col-md-4">
					<h2 class="h5">Text colours</h2>
					<p class="text-primary mb-1">.text-primary</p>
					<p class="text-success mb-1">.text-success</p>
					<p class="text-danger mb-1">.text-danger</p>
					<p class="text-body-secondary mb-1">.text-body-secondary</p>
					<p class="text-white bg-dark mb-1">.text-white (on .bg-dark)</p>
				</section>

				<section class="col-md-4">
					<h2 class="h5">Backgrounds</h2>
					<!-- text-bg-*: a background, and a text colour to match -->
					<div class="text-bg-primary p-2 mb-2">.text-bg-primary</div>
					<div class="text-bg-success p-2 mb-2">.text-bg-success</div>
					<div class="text-bg-warning p-2 mb-2">.text-bg-warning</div>
					<div class="text-bg-dark p-2 mb-2">.text-bg-dark</div>
				</section>

				<section class="col-md-4">
					<h2 class="h5">Spacing</h2>
					<!-- p = padding, m = margin. Sizes 0 to 5. -->
					<div class="bg-body-secondary border p-1 mb-2">.p-1</div>
					<div class="bg-body-secondary border p-3 mb-2">.p-3</div>
					<div class="bg-body-secondary border p-5 mb-2">.p-5</div>
					<div class="bg-body-secondary border px-5 py-1">.px-5 .py-1</div>
				</section>
			</div>
		</div>
	</body>
</html>
