<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<!-- Bootstrap is built phones first, so it needs last week's viewport tag -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 01: Bootstrap Starter</title>

		<!-- 1. Bootstrap's CSS, from a CDN -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
		<!-- 2. Your own CSS, AFTER Bootstrap's, so your rules win ties -->
		<link rel="stylesheet" href="01_bootstrap_starter_example.css">
	</head>
	<body>
		
		<div class="container">

			<h1 class="h1">this is my heading</h1>

			<!-- do stuff here -->
			<div class="row">
				<div class="col-md-2"> 
					<div class="text-bg-primary">
						this is the first column 
					</div>
				</div>
				<div class="col-md-8">
					<div class="text-bg-success">
						this is the second column
					</div>
 				</div>
				<div class="col-md-2"> 
					<div class="text-bg-danger">
						this is the third column
					</div>
				</div>
			</div>
			
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
