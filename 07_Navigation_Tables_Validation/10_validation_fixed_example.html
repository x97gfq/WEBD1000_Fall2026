<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 10 - Fixed and Valid</title>
		<style>
			body {
				font-family: "Segoe UI", Arial, sans-serif;
			}

			/* 2. Colour belongs in CSS, not in an HTML attribute */
			.alert {
				color: #C62828;
			}
		</style>
	</head>
	<body>

		<!-- 1. Every img needs alt (empty if it's only decoration) -->
		<img src="images/logo.svg" width="64" height="64" alt="">
		<h1>Today's Specials</h1>

		<!-- 3. Close with the same tag you opened -->
		<h2>Lobster Roll</h2>
		<p class="alert">Fresh lobster on a toasted bun.</p>

		<!-- 4. Last opened, first closed -->
		<p><strong><em>Today only!</em></strong></p>

	</body>
</html>
