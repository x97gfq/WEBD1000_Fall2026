<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 05 - Table Structure</title>
		<style>
			body {
				font-family: "Segoe UI", Arial, sans-serif;
			}
		</style>
	</head>
	<body>

		<table>
			<caption>Fresh Fish Prices</caption>
			<thead>
				<tr>
					<th scope="col">Fish</th>
					<th scope="col">Caught in</th>
					<th scope="col">Price / lb</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<th scope="row">Haddock</th>
					<td>Yarmouth</td>
					<td>$11.99</td>
				</tr>
				<tr>
					<th scope="row">Halibut</th>
					<td>Digby</td>
					<td>$24.50</td>
				</tr>
				<tr>
					<th scope="row">Scallops</th>
					<td>Digby</td>
					<td>$29.99</td>
				</tr>
				<tr>
					<th scope="row">Lobster (live)</th>
					<td>Lobster Bay</td>
					<td>$15.99</td>
				</tr>
			</tbody>
		</table>

	</body>
</html>
