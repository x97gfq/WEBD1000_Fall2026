<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Example 12 - Fixed and Valid CSS</title>
		<style>
			body {
				font-family: "Segoe UI", Arial, sans-serif;
			}

			/* 1. American spelling: color */
			h1 {
				color: #12304A;
			}

			/* 2. Numbers need a unit (only 0 doesn't) */
			p {
				font-size: 18px;
			}

			/* 3. A semicolon after every declaration */
			.price {
				font-weight: bold;
				color: #B5451B;
			}

			/* 4. text-align is left, right, center or justify */
			.note {
				text-align: center;
			}
		</style>
	</head>
	<body>

		<h1>Today's Specials</h1>
		<p>Fresh lobster on a toasted bun.</p>
		<p class="price">$24.00</p>
		<p class="note">While supplies last!</p>

	</body>
</html>
